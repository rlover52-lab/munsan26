<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2학년 6반">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<title>2학년 6반</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e4e7ee;--accent:#2f5b99;--accent-soft:#e8eef8}
  @media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2a303b;--accent:#8fb3ea;--accent-soft:#223149}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top)}
  .boot{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .boot h1{margin:8px 4px 2px;font-size:26px;letter-spacing:-.02em}
  .boot .msg{margin:0 4px 16px;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;flex-shrink:0}
  @keyframes s{to{transform:rotate(360deg)}}
  .sk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .bar{height:12px;border-radius:6px;background:var(--line);margin:10px 0;animation:p 1.2s ease-in-out infinite}
  .bar.w40{width:40%}.bar.w70{width:70%}.bar.w90{width:90%}.bar.big{height:64px;border-radius:12px}
  @keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
  .err{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
  .err button,.retry{font:inherit;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:10px 18px;margin-top:10px}
  #status{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card);color:var(--muted);border:1px solid var(--line);font-size:12px;padding:5px 12px;border-radius:999px;display:none;align-items:center;gap:6px;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  #status .spin{width:12px;height:12px}
</style>
</head>
<body>
<div id="app">
  <div class="boot">
    <h1>2학년 6반</h1>
    <p class="msg"><span class="spin"></span>학급 소식을 불러오는 중이에요…</p>
    <div class="sk"><div class="bar w40"></div><div class="bar big"></div></div>
    <div class="sk"><div class="bar w40"></div><div class="bar w90"></div><div class="bar w70"></div></div>
    <div class="sk"><div class="bar w40"></div><div class="bar w90"></div></div>
  </div>
</div>
<div id="status"><span class="spin"></span><span id="statusText">새 소식 확인 중</span></div>
<style id="pagecss"></style>
<script>
(function () {
  // ↓↓↓ 여기에 Apps Script 웹 앱 주소(…/exec)를 넣으세요 ↓↓↓
  var API = "여기에_웹앱_주소";
  // ↑↑↑ 따옴표는 지우지 마세요 ↑↑↑

  var KEY = "classpage-v1";
  var app = document.getElementById("app");
  var BOOT = app.innerHTML;
  var status = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var loading = false, lastLoad = 0;

  // ---- 보던 상태 기억하기: 스크롤 위치, 펼친 칸, 이름 찾기 글자 ----
  var STATE_KEY = "classpage-state";
  function captureState() {
    var st = { y: window.scrollY, open: [], clean: false, q: "", at: Date.now() };
    var ds = app.querySelectorAll("details");
    for (var i = 0; i < ds.length; i++) if (ds[i].open) st.open.push(i);
    var cb = document.getElementById("cleanBtn");
    st.clean = !!(cb && cb.getAttribute("aria-expanded") === "true");
    var q = document.getElementById("q");
    st.q = q ? q.value : "";
    return st;
  }
  function saveState() {
    if (app.querySelector(".boot")) return;
    try { localStorage.setItem(STATE_KEY, JSON.stringify(captureState())); } catch (e) {}
  }
  function applyState(st) {
    if (!st) return;
    var ds = app.querySelectorAll("details");
    (st.open || []).forEach(function (i) { if (ds[i]) ds[i].open = true; });
    if (st.clean) { var cb = document.getElementById("cleanBtn"); if (cb && cb.getAttribute("aria-expanded") !== "true") cb.click(); }
    if (st.q) { var q = document.getElementById("q"); if (q) { q.value = st.q; q.dispatchEvent(new Event("input")); } }
    if (st.y) window.scrollTo(0, st.y);
  }
  function savedState() {
    try {
      var st = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
      return st && Date.now() - st.at < 30 * 60 * 1000 ? st : null; // 30분 안에 보던 것만 되살림
    } catch (e) { return null; }
  }

  function show(parts, st) {
    document.getElementById("pagecss").textContent = parts.css || "";
    app.innerHTML = parts.body || "";
    if (parts.title) document.title = parts.title;
    try { if (parts.js) new Function(parts.js)(); } catch (e) { /* 화면은 그대로 둠 */ }
    applyState(st);
  }

  var saveTimer = null;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 300); }
  window.addEventListener("scroll", saveSoon, { passive: true });
  document.addEventListener("toggle", saveSoon, true);
  document.addEventListener("input", saveSoon, true);
  document.addEventListener("click", saveSoon, true);
  window.addEventListener("pagehide", saveState);

  function setStatus(text, on) {
    statusText.textContent = text;
    status.style.display = on ? "flex" : "none";
  }

  function load(fresh) {
    if (loading) return;
    loading = true;
    var hasPage = !app.querySelector(".boot");
    // 금방 끝나면 표시하지 않음. 새로고침 버튼을 누른 경우에만 바로 표시
    var timer = setTimeout(function () { if (hasPage) setStatus("새 소식 확인 중", true); }, fresh ? 0 : 1200);
    fetch(API + (API.indexOf("?") < 0 ? "?" : "&") + "format=json" + (fresh ? "&fresh=1" : "") + "&t=" + Date.now())
      .catch(function () { throw new Error("NET"); })
      .then(function (r) { if (!r.ok) throw new Error("HTTP" + r.status); return r.text(); })
      .then(function (text) {
        var parts;
        try { parts = JSON.parse(text); } catch (e) { throw new Error(/<html|<!doctype/i.test(text) ? "GOOGLE" : "JSON"); }
        if (!parts || !parts.body) throw new Error("EMPTY");
        var same = false;
        try { same = localStorage.getItem(KEY) === text; } catch (e) {}
        // 바뀐 게 없으면 다시 그리지 않음. 바뀌었으면 보던 상태 그대로 새 내용으로 교체
        if (!same || !hasPage) {
          try { show(parts, hasPage ? captureState() : savedState()); }
          catch (e) { show(parts, null); } // 상태 되살리기가 실패해도 새 내용은 보여 줌
        }
        lastLoad = Date.now();
        try { localStorage.setItem(KEY, text); } catch (e) {}
        clearTimeout(timer);
        setStatus("", false);
      })
      .catch(function (err) {
        clearTimeout(timer);
        var code = (err && err.message) || "?";
        var why = code === "NET" ? "인터넷 연결 문제" : code === "GOOGLE" ? "구글 스크립트 오류" : "응답 오류 " + code;
        if (hasPage) {
          setStatus("새 소식을 못 받았어요 (" + why + "). 저장된 내용이에요", true);
          setTimeout(function () { setStatus("", false); }, 5000);
        } else {
          app.innerHTML = '<div class="boot"><h1>2학년 6반</h1><div class="err">' +
            '<p>학급 소식을 불러오지 못했어요.<br>(' + why + ')</p>' +
            '<button type="button" class="retry">다시 시도</button></div></div>';
        }
      })
      .then(function () { loading = false; });
  }

  // 새로고침 버튼: 페이지 이동 없이 내용만 다시 불러옴
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest(".reload, .retry");
    if (!t) return;
    e.preventDefault();
    if (t.classList.contains("retry")) app.innerHTML = BOOT;
    load(true);
  });

  // 홈 화면 앱을 다시 열었을 때 2분이 지났으면 자동으로 최신 내용 확인
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastLoad > 2 * 60 * 1000) load();
  });

  // 첫 화면 파일을 휴대폰에 저장 (다음부터 켜자마자 바로 보이게)
  if ("serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("/sw.js"); } catch (e) {}
  }

  // 저장해 둔 내용이 있으면 바로 보여 주고, 뒤에서 최신 내용을 받아 옴
  try {
    var cached = localStorage.getItem(KEY);
    if (cached) show(JSON.parse(cached), savedState());
  } catch (e) {}
  load();
})();
</script>
</body>
</html>
